name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "src/windows/*.py"
      - "tests/*.py"
      - "requirements-windows.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller==6.11.1

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name RedEnVivo --collect-all pystray --collect-all PIL
          src/windows/red_en_vivo.py

      - name: Collect third-party license texts
        run: python src/windows/package_licenses.py

      - name: Upload executable for packaging
        uses: actions/upload-artifact@v4
        with:
          name: RedEnVivo-Windows-startup-fix
          path: dist/RedEnVivo.exe
          if-no-files-found: error
